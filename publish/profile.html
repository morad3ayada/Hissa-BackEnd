<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الملف الشخصي | منصة تعلم</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Cairo', sans-serif;
      background: radial-gradient(circle at 10% 30%, #0a0f2a, #030617);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #ffffff;
    }
    .profile-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 40px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 8px 40px rgba(0,0,0,0.4);
    }
    .profile-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .avatar-wrap {
      position: relative;
      width: 110px;
      height: 110px;
      margin: 0 auto 12px;
      cursor: pointer;
    }
    .avatar-wrap img {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 4px solid #8b5cf6;
      object-fit: cover;
    }
    .avatar-overlay {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity .2s;
      font-size: 24px;
      color: #fff;
    }
    .avatar-wrap:hover .avatar-overlay { opacity: 1; }
    .profile-name { font-size: 24px; font-weight: 700; color: #ffffff; }
    .profile-role { font-size: 14px; color: #94a3b8; margin-top: 4px; }
    .field {
      display: flex;
      flex-direction: column;
      padding: 14px 0;
      border-bottom: 1px solid #334155;
    }
    .field:last-child { border-bottom: none; }
    .field .label { color: #94a3b8; font-size: 13px; margin-bottom: 4px; }
    .field .value { color: #ffffff; font-weight: 600; font-size: 15px; }
    .field input, .field textarea {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px 14px;
      font-family: 'Cairo', sans-serif;
      font-size: 15px;
      color: #ffffff;
      outline: none;
      transition: border-color .2s;
    }
    .field input:focus, .field textarea:focus { border-color: #8b5cf6; }
    .field textarea { resize: vertical; min-height: 60px; }
    .actions {
      display: flex;
      gap: 12px;
      margin-top: 28px;
    }
    .btn {
      padding: 12px 24px;
      border-radius: 12px;
      font-family: 'Cairo', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all .2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
    }
    .btn-primary { background: #8b5cf6; color: #fff; flex: 1; }
    .btn-primary:hover { background: #7c3aed; }
    .btn-success { background: #10b981; color: #fff; }
    .btn-success:hover { background: #059669; }
    .btn-ghost {
      background: transparent;
      color: #94a3b8;
      border: 1px solid #334155;
    }
    .btn-ghost:hover { background: #334155; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-danger:hover { background: #dc2626; }
    .loading { text-align: center; padding: 40px; color: #94a3b8; }
    .loading i { font-size: 24px; }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #10b981;
      color: #fff;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      display: none;
      z-index: 999;
    }
    .toast.error { background: #ef4444; }
  </style>
</head>
<body>
  <div class="toast" id="toast"></div>
  <div class="profile-card" id="profileCard">
    <div class="loading" id="loadingState"><i class="fas fa-spinner fa-spin"></i><br>جاري تحميل الملف الشخصي...</div>
  </div>

  <script>
    const API_BASE = "https://numeriqan.com/api";
    let profileData = null;

    function getToken() { return localStorage.getItem('token'); }
    function authHeaders() {
      return { 'Authorization': `Bearer ${getToken()}`, 'Content-Type': 'application/json' };
    }

    async function tryRefreshToken() {
      const rt = localStorage.getItem('refreshToken');
      if (!rt) return false;
      try {
        const res = await fetch(`${API_BASE}/v1/Auth/Refresh`, {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ refreshToken: rt })
        });
        if (!res.ok) return false;
        const data = await res.json();
        if (data.succeeded && data.data) {
          localStorage.setItem('token', data.data.accessToken);
          localStorage.setItem('refreshToken', data.data.refreshToken);
          return true;
        }
        return false;
      } catch { return false; }
    }

    async function api(url, options = {}) {
      options.headers = { ...authHeaders(), ...options.headers };
      let res = await fetch(url, options).catch(() => null);
      if (!res) return makeEmptyRes();
      if (res.status === 401) {
        if (await tryRefreshToken()) {
          options.headers = { ...authHeaders(), ...options.headers };
          res = await fetch(url, options).catch(() => null);
          if (!res) return makeEmptyRes();
        } else {
          localStorage.clear();
          window.location.href = 'login.html';
          throw new Error('Session expired');
        }
      }
      const origJson = res.json.bind(res);
      res.json = async () => { try { return await origJson(); } catch { return {}; } };
      return res;
    }
    function makeEmptyRes() {
      return { json: async () => ({}), ok: false, status: 0, clone: () => makeEmptyRes(), text: async () => '', blob: async () => new Blob() };
    }
    window.addEventListener('unhandledrejection', e => { if (e.reason?.message?.includes('Unexpected end of JSON input')) e.preventDefault(); });
    setInterval(async () => { await tryRefreshToken(); }, 10 * 60 * 1000);

    function showToast(msg, isError) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast' + (isError ? ' error' : '');
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 3000);
    }

    async function loadProfile() {
      const card = document.getElementById('profileCard');
      try {
        const res = await fetch(`${API_BASE}/v1/Profile`, { headers: authHeaders() });
        if (res.status === 401) { window.location.href = 'login.html'; return; }
        const data = await res.json();
        if (!data.succeeded) { card.innerHTML = '<div class="loading">❌ فشل تحميل الملف الشخصي</div>'; return; }
        profileData = data.data;
        renderView();
      } catch { card.innerHTML = '<div class="loading">❌ حدث خطأ في الاتصال</div>'; }
    }

    function renderView() {
      const p = profileData;
      const name = p.fullName || p.firstName + ' ' + p.lastName || localStorage.getItem('userName') || 'مستخدم';
      const email = p.email || localStorage.getItem('email') || '—';
      const role = p.role || localStorage.getItem('userRole') || '—';
      const roleMap = { admin: 'مدير النظام', instructor: 'معلم', student: 'طالب', parent: 'ولي أمر' };
      const roleText = roleMap[role.toLowerCase()] || role;
      const avatarUrl = p.profilePictureUrl || `https://api.dicebear.com/7.x/adventurer/svg?seed=${encodeURIComponent(name)}&backgroundColor=b6e3f4`;

      document.getElementById('profileCard').innerHTML = `
        <div class="profile-header">
          <div class="avatar-wrap" onclick="document.getElementById('avatarInput').click()">
            <img src="${avatarUrl}" id="profileAvatar" alt="avatar">
            <div class="avatar-overlay"><i class="fas fa-camera"></i></div>
          </div>
          <input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="uploadAvatar(this)">
          <div class="profile-name">${name}</div>
          <div class="profile-role">${roleText}</div>
        </div>
        <div class="field">
          <span class="label"><i class="fas fa-envelope"></i> البريد الإلكتروني</span>
          <span class="value">${email}</span>
        </div>
        <div class="field">
          <span class="label"><i class="fas fa-user-tag"></i> الدور</span>
          <span class="value">${roleText}</span>
        </div>
        <div class="field">
          <span class="label"><i class="fas fa-user"></i> الاسم الأول</span>
          <span class="value" id="viewFirstName">${p.firstName || '—'}</span>
        </div>
        <div class="field">
          <span class="label"><i class="fas fa-user"></i> اسم العائلة</span>
          <span class="value" id="viewLastName">${p.lastName || '—'}</span>
        </div>
        <div class="field">
          <span class="label"><i class="fas fa-info-circle"></i> نبذة عني</span>
          <span class="value" id="viewBio">${p.bio || '—'}</span>
        </div>
        <div class="actions">
          <button class="btn btn-primary" onclick="enableEdit()"><i class="fas fa-edit"></i> تعديل</button>
          <button class="btn btn-ghost" onclick="window.location.href='dashboard.html'"><i class="fas fa-arrow-right"></i> العودة</button>
          <button class="btn btn-ghost" onclick="logout()"><i class="fas fa-sign-out-alt"></i> خروج</button>
        </div>
      `;
    }

    function enableEdit() {
      const p = profileData;
      const avatarUrl = p.profilePictureUrl || `https://api.dicebear.com/7.x/adventurer/svg?seed=${encodeURIComponent(p.fullName || p.firstName + ' ' + p.lastName)}&backgroundColor=b6e3f4`;
      document.getElementById('profileCard').innerHTML = `
        <div class="profile-header">
          <div class="avatar-wrap" onclick="document.getElementById('avatarInput').click()">
            <img src="${avatarUrl}" id="profileAvatar" alt="avatar">
            <div class="avatar-overlay"><i class="fas fa-camera"></i></div>
          </div>
          <input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="uploadAvatar(this)">
          <div class="profile-name">تعديل الملف الشخصي</div>
        </div>
        <div class="field">
          <span class="label">الاسم الأول</span>
          <input type="text" id="editFirstName" value="${p.firstName || ''}">
        </div>
        <div class="field">
          <span class="label">اسم العائلة</span>
          <input type="text" id="editLastName" value="${p.lastName || ''}">
        </div>
        <div class="field">
          <span class="label">نبذة عني</span>
          <textarea id="editBio" rows="3">${p.bio || ''}</textarea>
        </div>
        <div class="actions">
          <button class="btn btn-success" onclick="saveProfile()"><i class="fas fa-check"></i> حفظ</button>
          <button class="btn btn-ghost" onclick="renderView()"><i class="fas fa-times"></i> إلغاء</button>
        </div>
      `;
    }

    async function saveProfile() {
      const firstName = document.getElementById('editFirstName').value.trim();
      const lastName = document.getElementById('editLastName').value.trim();
      const bio = document.getElementById('editBio').value.trim();
      if (!firstName || !lastName) { showToast('الاسم الأول واسم العائلة مطلوبان', true); return; }
      try {
        const res = await fetch(`${API_BASE}/v1/Profile`, {
          method: 'PUT',
          headers: authHeaders(),
          body: JSON.stringify({ firstName, lastName, bio: bio || null })
        });
        const data = await res.json();
        if (data.succeeded) {
          profileData = data.data;
          const fullName = (data.data.firstName + ' ' + data.data.lastName).trim();
          if (fullName) localStorage.setItem('userName', fullName);
          showToast('✅ تم حفظ التغييرات');
          renderView();
        } else {
          showToast('❌ ' + (data.message || 'فشل الحفظ'), true);
        }
      } catch {
        showToast('❌ حدث خطأ في الاتصال', true);
      }
    }

    async function uploadAvatar(input) {
      const file = input.files?.[0];
      if (!file) return;
      const formData = new FormData();
      formData.append('file', file);
      try {
        const res = await fetch(`${API_BASE}/v1/Profile/picture`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${getToken()}` },
          body: formData
        });
        const data = await res.json();
        if (data.succeeded) {
          profileData = data.data;
          showToast('✅ تم تحديث الصورة');
          renderView();
        } else {
          showToast('❌ ' + (data.message || 'فشل رفع الصورة'), true);
        }
      } catch {
        showToast('❌ حدث خطأ في رفع الصورة', true);
      }
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('refreshToken');
      localStorage.removeItem('userRole');
      localStorage.removeItem('userName');
      window.location.href = 'login.html';
    }

    loadProfile();
  </script>
</body>
</html>
